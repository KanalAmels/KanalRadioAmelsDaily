
name: Daily nach Devel kopieren

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Daily auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Devel vollständig ersetzen
        env:
          GH_TOKEN: ${{ secrets.DEVEL_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "Fehler: Repository-Secret DEVEL_SYNC_TOKEN fehlt."
            exit 1
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add devel "https://x-access-token:${GH_TOKEN}@github.com/KanalAmels/KanalRadioAmelsDevel.git"

          git push --force devel HEAD:refs/heads/main
