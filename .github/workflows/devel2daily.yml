
name: Devel nach Daily kopieren

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'KanalAmels/KanalRadioAmelsDevel'
    runs-on: ubuntu-latest

    steps:
      - name: Devel auschecken
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Daily vollständig mit Devel synchronisieren
        env:
          GH_TOKEN: ${{ secrets.DAILY_SYNC_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "Fehler: Repository-Secret DAILY_SYNC_TOKEN fehlt."
            exit 1
          fi

          git remote add daily "https://x-access-token:${GH_TOKEN}@github.com/KanalAmels/KanalRadioAmelsDaily.git"
          git push --force daily HEAD:refs/heads/main

          echo "Devel wurde vollständig nach Daily übertragen."
