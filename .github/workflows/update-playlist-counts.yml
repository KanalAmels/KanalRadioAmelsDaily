
name: Update Playlist Counts

on:
  workflow_dispatch:

  schedule:
    # Täglich um 07:00 UTC
    # Nur im Daily-Repository tatsächlich ausführen
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: update-playlist-counts
  cancel-in-progress: false

jobs:
  update-counts:
    # Devel: nur manuell
    # Daily: manuell und täglich automatisch
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'schedule' &&
        github.repository == 'KanalAmels/KanalRadioAmelsDaily'
      )

    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: YouTube-Songzahlen und Metadaten abrufen
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          # Bestehende sieben Playlists
          playlists = {
              "1960th_radio": "PLPzm8oQAlWx0",
              "1990th_radio": "PLdaYDPTMIOWM",
              "1990th_dance": "PLEi-YU-8ROTg",
              "2000th_radio": "PLJFKda6JaE-E",
              "2000th_dance": "PLd3WfsuUQBoc",
              "2010th_radio": "PLITF5xF88VJI",
              "2010th_dance": "PLbKWWKlHJcRk",
          }

          # Daily zusätzlich für die Metadaten
          daily_playlist_id = "PLUu1efwCKMCM"

          all_playlists = {
              **playlists,
              "Daily": daily_playlist_id,
          }

          api_key = os.environ.get("YOUTUBE_API_KEY")

          if not api_key:
              sys.exit(
                  "FEHLER: YOUTUBE_API_KEY fehlt."
              )

          def youtube_request(endpoint, parameters):
              """
              YouTube Data API aufrufen.
              Der API-Schlüssel bleibt in GitHub Secrets.
              """

              parameters = {
                  **parameters,
                  "key": api_key,
              }

              query = urllib.parse.urlencode(
                  parameters
              )

              url = (
                  "https://www.googleapis.com/"
                  "youtube/v3/"
                  + endpoint
                  + "?"
                  + query
              )

              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json"
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:
                      return json.load(response)

              except urllib.error.HTTPError as error:
                  details = error.read().decode(
                      "utf-8",
                      errors="replace"
                  )

                  sys.exit(
                      "FEHLER YouTube API "
                      + endpoint
                      + ": HTTP "
                      + str(error.code)
                      + "\n"
                      + details
                  )

              except Exception as error:
                  sys.exit(
                      "FEHLER YouTube API "
                      + endpoint
                      + ": "
                      + str(error)
                  )

          # -------------------------------------------------
          # 1. Bisherige Songzahlen unverändert ermitteln
          # -------------------------------------------------

          result = youtube_request(
              "playlists",
              {
                  "part": "contentDetails",
                  "id": ",".join(
                      playlists.values()
                  ),
                  "maxResults": 50,
              }
          )

          counts_by_id = {}

          for item in result.get("items", []):
              playlist_id = item.get("id")

              count = item.get(
                  "contentDetails", {}
              ).get("itemCount")

              if (
                  playlist_id
                  and type(count) is int
                  and count >= 0
              ):
                  counts_by_id[playlist_id] = count

          missing = [
              key
              for key, playlist_id in playlists.items()
              if playlist_id not in counts_by_id
          ]

          if missing:
              sys.exit(
                  "FEHLER: Playlists nicht gefunden: "
                  + ", ".join(missing)
              )

          counts = {
              key: counts_by_id[playlist_id]
              for key, playlist_id in playlists.items()
          }

          with open(
              "playlist-counts.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  counts,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

              file.write("\n")

          print("Ermittelte Songzahlen:")

          for key, count in counts.items():
              print(
                  f"{key}: {count} Songs"
              )

          # -------------------------------------------------
          # 2. Playlist-Einträge in Originalreihenfolge
          #    ermitteln
          # -------------------------------------------------

          def get_playlist_items(playlist_id):
              items = []
              next_page_token = None

              while True:
                  parameters = {
                      "part": "contentDetails",
                      "playlistId": playlist_id,
                      "maxResults": 50,
                  }

                  if next_page_token:
                      parameters["pageToken"] = (
                          next_page_token
                      )

                  response = youtube_request(
                      "playlistItems",
                      parameters
                  )

                  for item in response.get(
                      "items", []
                  ):
                      video_id = item.get(
                          "contentDetails", {}
                      ).get("videoId")

                      # Auch nicht mehr verfügbare
                      # Einträge berücksichtigen, damit
                      # die Positionen nicht verrutschen.
                      items.append(
                          {
                              "videoId": video_id
                          }
                      )

                  next_page_token = response.get(
                      "nextPageToken"
                  )

                  if not next_page_token:
                      break

              return items

          # -------------------------------------------------
          # 3. Videotitel und Kanalnamen abrufen
          # -------------------------------------------------

          def get_video_details(video_ids):
              details = {}

              # YouTube erlaubt maximal 50 IDs
              # pro videos.list-Abfrage.
              for start in range(
                  0,
                  len(video_ids),
                  50
              ):
                  batch = video_ids[
                      start:start + 50
                  ]

                  response = youtube_request(
                      "videos",
                      {
                          "part": "snippet",
                          "id": ",".join(batch),
                          "maxResults": 50,
                      }
                  )

                  for video in response.get(
                      "items", []
                  ):
                      video_id = video.get("id")

                      snippet = video.get(
                          "snippet", {}
                      )

                      if not video_id:
                          continue

                      details[video_id] = {
                          "videoId": video_id,
                          "title": snippet.get(
                              "title", ""
                          ),
                          "author": snippet.get(
                              "channelTitle", ""
                          ),
                      }

              return details

          # -------------------------------------------------
          # 4. Metadaten aller Playlists aufbauen
          # -------------------------------------------------

          playlist_entries = {}
          all_video_ids = set()

          print(
              "\nPlaylist-Einträge werden abgerufen:"
          )

          for key, playlist_id in (
              all_playlists.items()
          ):
              entries = get_playlist_items(
                  playlist_id
              )

              playlist_entries[key] = entries

              for entry in entries:
                  video_id = entry.get(
                      "videoId"
                  )

                  if video_id:
                      all_video_ids.add(
                          video_id
                      )

              print(
                  f"{key}: {len(entries)} Einträge"
              )

          # Videodaten nur einmal pro Video abrufen,
          # auch wenn es in mehreren Playlists vorkommt.
          video_details = get_video_details(
              sorted(all_video_ids)
          )

          metadata = {
              "playlists": {}
          }

          for key, playlist_id in (
              all_playlists.items()
          ):
              songs = []

              for entry in playlist_entries[key]:
                  video_id = entry.get(
                      "videoId"
                  )

                  details = video_details.get(
                      video_id, {}
                  )

                  songs.append(
                      {
                          "videoId": video_id,
                          "title": details.get(
                              "title", ""
                          ),
                          "author": details.get(
                              "author", ""
                          ),
                      }
                  )

              metadata["playlists"][
                  playlist_id
              ] = {
                  "name": key,
                  "songs": songs,
              }

          # -------------------------------------------------
          # 5. Metadaten als JSON speichern
          # -------------------------------------------------

          with open(
              "playlist-metadata.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  metadata,
                  file,
                  indent=2,
                  ensure_ascii=False
              )

              file.write("\n")

          print(
              "\nplaylist-metadata.json erstellt."
          )

          print(
              "Verfügbare Videodaten:",
              len(video_details)
          )

          print(
              "Alle Playlist-Daten erfolgreich "
              "verarbeitet."
          )
          PY

      - name: Songzahlen und Metadaten speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            playlist-counts.json \
            playlist-metadata.json

          if git diff --cached --quiet; then
            echo "Songzahlen und Metadaten unverändert."
          else
            git commit -m \
              "Songzahlen und Playlist-Metadaten aktualisieren"

            git push
          fi
