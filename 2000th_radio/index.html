
<!DOCTYPE html>
<html lang="de">

<head>
  
  <script defer src="https://cloud.umami.is/script.js" data-website-id="0bcec99c-b0ab-4797-84eb-0e30cbcba35e"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kanal-Radio Amels 2000th Radio</title>

  <!-- Zentrales Menü -->
  <link rel="stylesheet" href="../menu.css">
  <script src="../menu.js" defer></script>

  <link rel="stylesheet" href="../style.css">

  <!-- Vorschau für WhatsApp und soziale Netzwerke -->

  <meta property="og:type" content="website">
  <meta property="og:title"
        content="🎶 Kanal-Radio Amels 2000th Radio">
  <meta property="og:description"
        content="Die Radio-Hits der 2000er – einschalten und genießen!">
  <meta property="og:image"
        content="https://kanalamels.github.io/KanalRadioAmelsDaily/2000th_radio/radiocover_2000th_radio.png">

</head>

<body>

  <!-- Kopfzeile -->

  <header>
    <h1>Kanal-Radio Amels <span style="color: #facc15;">&#9835;</span> 😃👍</h1>

    <!-- Das Menü wird zentral geladen -->
    <div class="menu-container" id="menu-container"></div>
  </header>

  <!-- Titelbild -->

  <img
    class="cover"
    id="radio-cover"
    src="radiocover_2000th_radio.png"
    alt="Kanal-Radio Amels 2000th Radio Titelbild"
  >

  <!-- YouTube-Player -->

  <div class="player">
    <div id="radio"></div>
  </div>

  <!-- Steuerung -->

  <div class="controls">
    <button id="previous" type="button">⏮️ Last</button>
    <button id="start" type="button">⏯️ Start</button>
    <button id="next" type="button">⏭️ Next</button>
  </div>

  <!-- Spruch und YouTube-Link -->

  <div class="footer">

    <p class="tagline">
      Deine Musik.<br>
      Dein Kanal-Radio.
    </p>

    <a
      class="youtube-button"
      href="https://www.youtube.com/playlist?list=PLJFKda6JaE-E"
      target="_blank"
      rel="noopener noreferrer">
      ▶ Auf YouTube öffnen
    </a>

  </div>

  <!-- Kanalkonfiguration -->
  <script>
    window.radioConfig = {
      kanal: "2000Th Radio",
      playlist: "PLJFKda6JaE-E"
    };
  </script>

  <!-- Zentrale Radiosteuerung -->
  <script src="../radio.js"></script>

  <!-- YouTube-API -->
  <script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
