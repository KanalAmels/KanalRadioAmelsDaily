<script>
  // Immer nur ein Jahrzehnt gleichzeitig öffnen
  document.querySelectorAll(
    "#menu-dropdown .menu-decade"
  ).forEach(function (decade) {

    decade.addEventListener("toggle", function () {
      if (!decade.open) return;

      document.querySelectorAll(
        "#menu-dropdown .menu-decade"
      ).forEach(function (other) {
        if (other !== decade) {
          other.open = false;
        }
      });
    });

  });
</script>
