  <style>
    /* Jahrzehnte */

    #menu-dropdown .menu-decade {
      width: 100%;
    }

    #menu-dropdown .menu-decade > summary {
      display: grid;
      grid-template-columns: 32px 1fr 18px;
      align-items: center;
      column-gap: 10px;
      cursor: pointer;
      list-style: none;
      user-select: none;
      color: #facc15;
    }

    #menu-dropdown .menu-decade > summary::-webkit-details-marker {
      display: none;
    }

    /* Gelbe Aufklapppfeile */

    #menu-dropdown .menu-arrow {
      color: #facc15;
      font-size: 20px;
      text-align: center;
    }

    #menu-dropdown .menu-arrow::after {
      content: "›";
    }

    #menu-dropdown .menu-decade[open] .menu-arrow::after {
      content: "⌄";
    }

    /* Untermenüs */

    #menu-dropdown .menu-submenu {
      padding-left: 16px;
    }

    #menu-dropdown .menu-submenu a {
      display: grid;
      grid-template-columns: 32px 1fr;
      align-items: center;
      column-gap: 10px;
      color: #facc15;
    }

    /* Daily und alle anderen Links */

    #menu-dropdown > a {
      display: grid;
      grid-template-columns: 32px 1fr;
      align-items: center;
      column-gap: 10px;
      color: #facc15;
    }

    /* Einheitlicher Hover-Effekt */

    #menu-dropdown .menu-decade > summary:hover,
    #menu-dropdown .menu-decade > summary:focus-visible,
    #menu-dropdown .menu-submenu a:hover,
    #menu-dropdown .menu-submenu a:focus-visible,
    #menu-dropdown > a:hover,
    #menu-dropdown > a:focus-visible {
      background: #374151;
      color: #facc15;
      font-weight: bold;
    }
  </style>
