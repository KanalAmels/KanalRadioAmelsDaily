<style>
  /* Aufgeklapptes Jahrzehnt fett hervorheben */
  #menu-dropdown .menu-decade[open] > summary {
    font-weight: bold;
  }

  /*
   * Untermenü mit dynamischen Spalten:
   * Symbol | Playlistname | Songanzahl
   */

  #menu-dropdown .menu-submenu {
    display: grid;
    grid-template-columns: 1fr;
    min-width: max-content;
  }

  #menu-dropdown .menu-submenu > a {
    display: grid;
    grid-template-columns: 22px minmax(max-content, 1fr) auto;
    align-items: center;
    column-gap: 10px;
    width: 100%;
    color: #facc15;
    text-decoration: none;
  }

  #menu-dropdown .menu-submenu > a > svg {
    width: 22px;
    height: 22px;
    flex-shrink: 0;
  }

  #menu-dropdown .menu-playlist-name {
    text-align: left;
    white-space: nowrap;
  }

  #menu-dropdown .menu-song-count {
    text-align: right;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  #menu-dropdown .menu-song-count:empty {
    display: none;
  }

  /* Aktive Playlist weiterhin fett */
  #menu-dropdown .menu-submenu a[aria-current="page"] {
    font-weight: bold;
  }

  /* Bei angekündigten Jahrzehnten keinen Pfeil anzeigen */
  #menu-dropdown .menu-decade[data-coming-soon] > summary .menu-arrow {
    display: none !important;
  }
</style>
