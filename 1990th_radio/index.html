
<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Kanal-Radio Amels 1990th Radio</title>

  <!-- Zentrales Menü -->
  <link rel="stylesheet" href="../menu.css">
  <script src="../menu.js" defer></script>

  <link rel="stylesheet" href="../style.css">

  <!-- Vorschau für WhatsApp und soziale Netzwerke -->

  <meta property="og:type" content="website">
  <meta property="og:title"
        content="🎶 Kanal-Radio Amels 1990th Radio">
  <meta property="og:description"
        content="Die Radio-Hits der 90er – einschalten und genießen!">
  <meta property="og:image"
        content="https://kanalamels.github.io/KanalRadioAmelsDaily/1990th_radio/radiocover_1990th_radio.png">

</head>

<body>

  <!-- Kopfzeile -->

  <header>
    <h1>Kanal-Radio Amels <span style="color: #facc15;">&#9835;</span> 😃👍</h1>

    <!-- Das Menü wird zentral geladen -->
    <div class="menu-container" id="menu-container"></div>
  </header>

  <!-- Titelbild -->

  <img
    class="cover"
    id="radio-cover"
    src="radiocover_1990th_radio.png"
    alt="Kanal-Radio Amels 1990th Radio Titelbild"
  >

  <!-- YouTube-Player -->

  <div class="player">
    <div id="radio"></div>
  </div>

  <!-- Steuerung -->

  <div class="controls">
    <button id="previous" type="button">⏮ Last</button>
    <button id="start" type="button">▶ Start</button>
    <button id="next" type="button">⏭ Next</button>
  </div>

  <!-- Spruch und YouTube-Link -->

  <div class="footer">

    <p class="tagline">
      Deine Musik.<br>
      Dein Kanal-Radio.
    </p>

    <a
      class="youtube-button"
      href="https://www.youtube.com/playlist?list=PLdaYDPTMIOWM"
      target="_blank"
      rel="noopener noreferrer">
      ▶ Auf YouTube öffnen
    </a>

  </div>

  <!-- YouTube-API -->

  <script src="https://www.youtube.com/iframe_api"></script>

  <script>
    let player;
    let playerReady = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player("radio", {
        width: "100%",
        height: "100%",
        playerVars: {
          listType: "playlist",
          list: "PLdaYDPTMIOWM",
          playsinline: 1,
          rel: 0
        },
        events: {
          onReady: function () {
            playerReady = true;
          }
        }
      });
    }

    function control(action) {
      if (!playerReady) {
        alert("Der Player lädt noch. Bitte erneut versuchen.");
        return;
      }

      player[action]();
    }

    document.getElementById("start")
      .addEventListener("click", function () {
        control("playVideo");
      });

    document.getElementById("previous")
      .addEventListener("click", function () {
        control("previousVideo");
      });

    document.getElementById("next")
      .addEventListener("click", function () {
        control("nextVideo");
      });
  </script>

</body>
</html>
