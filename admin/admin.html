
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kanal-Radio Amels – Studio-Zentrale</title>
  <style>
    :root { --bg: #17202b; --gold: #facc15; --orange: #e6ad48; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, sans-serif; background: var(--bg); color: #fff; text-align: center; }
    main { width: min(1420px, calc(100% - 36px)); min-height: 100vh; margin: 0 auto; padding: clamp(30px, 6vh, 65px) 0 40px; display: flex; flex-direction: column; align-items: center; }
    h1 { margin: 0; color: var(--gold); font-size: clamp(34px, 3.5vw, 52px); line-height: 1.15; }
    h2 { margin: 16px 0 0; color: var(--orange); font-size: clamp(25px, 2.5vw, 34px); font-weight: 500; }
    .button-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px 18px; width: 100%; margin-top: clamp(38px, 8vh, 78px); }
    .button, button { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 74px; padding: 14px 10px; border: 0; border-radius: 10px; background: var(--orange); color: var(--bg); font: bold 16px/1.35 Arial, sans-serif; text-decoration: none; cursor: pointer; }
    .button:hover, button:not(:disabled):hover { filter: brightness(1.08); }
    .github { background: #66a9e8; color: #000; }
    .youtube { background: #cf252b; color: #fff; }
    .umami, .chatgpt { background: #d86dcd; color: #000; }
    .spotify { background: #1db954; color: #000; }
    .spotify:disabled { opacity: 1; cursor: default; }
    .spotify:disabled:hover { filter: none; }
    #status { margin: clamp(35px, 6vh, 65px) 0 22px; color: var(--orange); font-size: 17px; font-weight: bold; line-height: 1.5; }
    .visitor-controls { display: flex; flex-direction: column; gap: 15px; width: calc((100% - 4 * 18px) / 5); align-self: center; }
    .tracking-off { background: #1db954; color: #000; }
    .tracking-on { background: #cf252b; color: #fff; }
    small { display: block; margin-top: 25px; color: var(--orange); font-size: 14px; line-height: 1.5; }
    @media (max-width: 900px) {
      .button-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .visitor-controls { width: min(360px, 100%); }
    }
    @media (max-width: 520px) {
      main { width: min(100% - 28px, 440px); }
      .button-grid { grid-template-columns: 1fr; gap: 12px; }
      .button, button { min-height: 62px; }
      #status { margin-top: 32px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Kanal-Radio Amels</h1>
    <h2>Studio-Zentrale</h2>

    <nav class="button-grid" aria-label="Studio-Zentrale – Schnellzugriff">
      <a class="button" href="https://kanalamels.github.io/KanalRadioAmelsDaily/" target="_blank" rel="noopener noreferrer">▶ Kanal-Radio Daily</a>
      <a class="button github" href="https://github.com/kanalamels/KanalRadioAmelsDaily" target="_blank" rel="noopener noreferrer">💻 GitHub Daily</a>
      <a class="button chatgpt" href="https://chatgpt.com/" target="_blank" rel="noopener noreferrer">✦ ChatGPT</a>
      <a class="button youtube" id="youtube-daily-link" href="#" aria-disabled="true" target="_blank" rel="noopener noreferrer">▶ YouTube Daily</a>
      <button class="spotify" type="button" disabled title="Spotify folgt später">♫ Spotify Dummy</button>

      <a class="button" href="https://kanalamels.github.io/KanalRadioAmelsDevel/" target="_blank" rel="noopener noreferrer">▶ Kanal-Radio Devel</a>
      <a class="button github" href="https://github.com/kanalamels/KanalRadioAmelsDevel" target="_blank" rel="noopener noreferrer">💻 GitHub Devel</a>
      <a class="button umami" href="https://cloud.umami.is/" target="_blank" rel="noopener noreferrer">📊 Umami-Statistik</a>
      <a class="button youtube" href="https://www.youtube.com/@RudolfErkens/playlists" target="_blank" rel="noopener noreferrer">▶ YouTube Playlists</a>
      <button class="spotify" type="button" disabled title="Spotify folgt später">♫ Spotify Dummy</button>
    </nav>

    <p id="status" role="status" aria-live="polite"></p>

    <div class="visitor-controls" aria-label="Besucherzählung steuern">
      <button class="tracking-off" type="button" onclick="disableTracking()">🔒 Meine Besuche nicht zählen</button>
      <button class="tracking-on" type="button" onclick="enableTracking()">🔓 Meine Besuche zählen</button>
    </div>

    <small>Die Einstellung gilt für diesen Browser und diese Website.</small>
  </main>

  <script>
    function updateStatus() {
      const disabled = localStorage.getItem("umami.disabled") === "1";
      document.getElementById("status").textContent = disabled
        ? "✅ Deine Besuche werden nicht gezählt."
        : "⚠️ Deine Besuche werden derzeit gezählt.";
    }

    function disableTracking() {
      localStorage.setItem("umami.disabled", "1");
      updateStatus();
    }

    function enableTracking() {
      localStorage.removeItem("umami.disabled");
      updateStatus();
    }

    async function updateYoutubeDailyLink() {
      const link = document.getElementById("youtube-daily-link");

      try {
        const response = await fetch(
          "../json/playlist-metadata.json",
          { cache: "no-store" }
        );

        if (!response.ok) {
          throw new Error("Playlist-Metadaten konnten nicht geladen werden.");
        }

        const data = await response.json();

        const daily = Object.entries(data.playlists || {}).find(
          ([id, playlist]) => playlist && playlist.name === "Daily"
        );

        if (!daily) {
          throw new Error("Daily-Playlist nicht gefunden.");
        }

        const playlistId = daily[0];

        if (!/^[A-Za-z0-9_-]{5,100}$/.test(playlistId)) {
          throw new Error("Ungültige Playlist-ID.");
        }

        link.href =
          "https://www.youtube.com/playlist?list=" +
          encodeURIComponent(playlistId);

        link.removeAttribute("aria-disabled");

      } catch (error) {
        console.error(
          "YouTube-Daily-Link konnte nicht aktualisiert werden:",
          error
        );
        link.title = "Daily-Playlist derzeit nicht verfügbar";
      }
    }

    document.getElementById("youtube-daily-link")
      .addEventListener("click", function (event) {
        if (this.getAttribute("aria-disabled") === "true") {
          event.preventDefault();
        }
      });

    updateStatus();
    updateYoutubeDailyLink();
  </script>
</body>
</html>
