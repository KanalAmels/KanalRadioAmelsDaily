<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KanalRadio Amels – Radiodirektor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #17202b;
      color: white;
      text-align: center;
      padding: 35px 18px;
    }
    main {
      max-width: 1400px;
      margin: 30px auto;
    }
    .button-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 18px;
      margin: 24px 0;
      align-items: stretch;
    }
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-width: 0;
    }
    button, a.button {
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      width: 100%;
      min-height: 74px;
      margin: 0;
      padding: 15px 10px;
      border: 0;
      border-radius: 10px;
      background: #e6ad48;
      color: #17202b;
      font-family: inherit;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.35;
      text-decoration: none;
      cursor: pointer;
    }
    button:hover, a.button:hover { filter: brightness(1.07); }
    .secondary {
      background: #344457 !important;
      color: white !important;
    }
    .github { background: #66a9e8; color: #000000; }
    .youtube, .tracking-on { background: #cf252b; color: #ffffff; }
    .spotify, .tracking-off { background: #1db954; color: #000000; }
    .spotify:disabled { opacity: 1; cursor: default; }
    .spotify:disabled:hover { filter: none; }
    #status {
      margin: 20px 0 25px;
      font-weight: bold;
      line-height: 1.5;
    }
    small { color: #bfc9d5; }
    @media (max-width: 850px) {
      .button-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 480px) {
      .button-grid { grid-template-columns: 1fr; }
      body { padding: 24px 14px; }
      main { margin: 20px auto; }
    }
  </style>
</head>
<body>
  <main>
    <h1>📻 KanalRadio Amels</h1>
    <h2>Radiodirektor-Zentrale</h2>

    <p id="status" role="status" aria-live="polite"></p>

    <div class="button-grid">
      <div class="button-group">
        <a class="button" href="https://kanalamels.github.io/KanalRadioAmelsDaily/daily/" target="_blank" rel="noopener noreferrer">▶ KanalRadio Daily öffnen</a>
        <a class="button" href="https://kanalamels.github.io/KanalRadioAmelsDevel/" target="_blank" rel="noopener noreferrer">▶ KanalRadio Devel öffnen</a>
      </div>
      <div class="button-group">
        <a class="button github" href="https://github.com/kanalamels/KanalRadioAmelsDaily" target="_blank" rel="noopener noreferrer">💻 GitHub Daily öffnen</a>
        <a class="button github" href="https://github.com/kanalamels/KanalRadioAmelsDevel" target="_blank" rel="noopener noreferrer">💻 GitHub Devel öffnen</a>
      </div>
      <div class="button-group">
        <a class="button youtube" href="https://www.youtube.com/@RudolfErkens/playlists" target="_blank" rel="noopener noreferrer">▶ YouTube Playlists</a>
        <button type="button" class="spotify" disabled title="Spotify-Playlists folgen später">♫ Spotify Playlists</button>
      </div>
      <div class="button-group">
        <a class="button secondary" href="https://cloud.umami.is/" target="_blank" rel="noopener noreferrer">📊 Umami-Statistik öffnen</a>
      </div>
      <div class="button-group">
        <button type="button" class="tracking-off" onclick="disableTracking()">🔒 Meine Besuche nicht zählen</button>
        <button type="button" class="tracking-on" onclick="enableTracking()">🔓 Besucherzählung wieder aktivieren</button>
      </div>
    </div>

    <small>Die Einstellung gilt für diesen Browser und diese Website.</small>
  </main>
  <script>
    function updateStatus() {
      const disabled = localStorage.getItem("umami.disabled") === "1";
      document.getElementById("status").textContent = disabled
        ? "✅ Deine Besuche werden nicht gezählt."
        : "⚠️ Deine Besuche werden derzeit gezählt.";
    }
    function disableTracking() {
      localStorage.setItem("umami.disabled", "1");
      updateStatus();
    }
    function enableTracking() {
      localStorage.removeItem("umami.disabled");
      updateStatus();
    }
    updateStatus();
  </script>
</body>
</html>
