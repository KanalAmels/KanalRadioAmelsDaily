
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KanalRadio Amels – Radiodirektor</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #17202b;
      color: white;
      text-align: center;
      padding: 35px 18px;
    }

    main {
      max-width: 440px;
      margin: 30px auto;
    }

    button, a.button {
      display: block;
      box-sizing: border-box;
      width: 100%;
      margin: 15px 0;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #e6ad48;
      color: #17202b;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .secondary {
      background: #344457 !important;
      color: white !important;
    }

    #status {
      margin: 25px 0;
      font-weight: bold;
      line-height: 1.5;
    }

    small {
      color: #bfc9d5;
    }
  </style>
</head>

<body>
  <main>
    <h1>📻 KanalRadio Amels</h1>
    <h2>Radiodirektor-Zentrale</h2>

    <p id="status"></p>

    <button type="button" onclick="disableTracking()">
      🔒 Meine Besuche nicht zählen
    </button>

    <button type="button"
            class="secondary"
            onclick="enableTracking()">
      🔓 Besucherzählung wieder aktivieren
    </button>

    <a class="button" href="../daily/index.html">
      ▶ KanalRadio Daily öffnen
    </a>

    <a class="button" href="https://kanalamels.github.io/KanalRadioAmelsDevel/">
      ▶ KanalRadio Devel öffnen
    </a>

    <a class="button secondary"
       href="https://cloud.umami.is/"
       target="_blank"
       rel="noopener noreferrer">
      📊 Umami-Statistik öffnen
    </a>

    <small>
      Die Einstellung gilt für diesen Browser
      und diese Website.
    </small>
  </main>

  <script>
    function updateStatus() {
      const disabled =
        localStorage.getItem("umami.disabled") === "1";

      document.getElementById("status").textContent =
        disabled
          ? "✅ Deine Besuche werden nicht gezählt."
          : "⚠️ Deine Besuche werden derzeit gezählt.";
    }

    function disableTracking() {
      localStorage.setItem("umami.disabled", "1");
      updateStatus();
    }

    function enableTracking() {
      localStorage.removeItem("umami.disabled");
      updateStatus();
    }

    updateStatus();
  </script>
</body>
</html>
